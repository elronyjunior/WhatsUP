<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatApp — Observer + Strategy</title>
  <meta name="description" content="Protótipo de chat implementando os padrões de projeto Observer e Strategy em tempo real com Node.js e Socket.IO." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ════════════════════════════════════════════
     LOGIN / REGISTRO SCREEN
════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">💬</div>
      <h1>ChatApp</h1>
    </div>
    <p class="login-subtitle">Protótipo com Observer + Strategy</p>

    <!-- Abas Login / Registro -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="trocarAba('login')">Entrar</button>
      <button class="auth-tab" id="tab-registro" onclick="trocarAba('registro')">Criar Conta</button>
    </div>

    <!-- Formulário de Login -->
    <div id="form-login" class="auth-form">
      <label class="login-label" for="input-nome">Seu nome de usuário</label>
      <div class="login-input-wrap">
        <input
          id="input-nome"
          class="login-input"
          type="text"
          placeholder="Digite seu nome..."
          maxlength="30"
          autocomplete="off"
        />
      </div>

      <label class="login-label" for="input-senha">Senha</label>
      <div class="login-input-wrap">
        <input
          id="input-senha"
          class="login-input"
          type="password"
          placeholder="Digite sua senha..."
          maxlength="50"
          autocomplete="current-password"
        />
      </div>

      <div id="login-error" class="login-error hidden"></div>

      <button id="btn-entrar" class="btn-primary">
        <span class="btn-text">Entrar no Chat</span>
        <span class="btn-loading hidden">⏳ Entrando...</span>
      </button>
    </div>

    <!-- Formulário de Registro -->
    <div id="form-registro" class="auth-form hidden">
      <label class="login-label" for="input-reg-nome">Escolha um nome de usuário</label>
      <div class="login-input-wrap">
        <input
          id="input-reg-nome"
          class="login-input"
          type="text"
          placeholder="Mínimo 3 caracteres..."
          maxlength="30"
          autocomplete="off"
        />
      </div>

      <label class="login-label" for="input-reg-senha">Crie uma senha</label>
      <div class="login-input-wrap">
        <input
          id="input-reg-senha"
          class="login-input"
          type="password"
          placeholder="Mínimo 4 caracteres..."
          maxlength="50"
          autocomplete="new-password"
        />
      </div>

      <label class="login-label" for="input-reg-senha2">Confirme a senha</label>
      <div class="login-input-wrap">
        <input
          id="input-reg-senha2"
          class="login-input"
          type="password"
          placeholder="Repita a senha..."
          maxlength="50"
          autocomplete="new-password"
        />
      </div>

      <div id="registro-error" class="login-error hidden"></div>

      <button id="btn-registrar" class="btn-primary btn-registro">
        <span class="btn-text">Criar Conta</span>
        <span class="btn-loading hidden">⏳ Criando...</span>
      </button>
    </div>

    <div class="login-patterns">
      <span class="pattern-badge observer">🔔 Observer</span>
      <span class="pattern-badge strategy">⚡ Strategy</span>
      <span class="pattern-badge cassandra-badge">🗄️ Cassandra</span>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     CHAT SCREEN
════════════════════════════════════════════ -->
<div id="chat-screen" class="hidden">

  <!-- ─── SIDEBAR ─── -->
  <aside class="sidebar">

    <!-- Header da Sidebar -->
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="brand-icon">💬</div>
        <span class="brand-title">ChatApp</span>
      </div>
      <div class="meu-perfil">
        <div class="perfil-avatar" id="avatar-inicial">?</div>
        <div class="perfil-info">
          <div class="perfil-nome" id="nome-usuario">Usuário</div>
          <div class="perfil-status">Online</div>
        </div>
        <!-- Botão criar grupo -->
        <button id="btn-criar-grupo" class="btn-novo-grupo" title="Criar novo grupo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Busca -->
    <div class="sidebar-search">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          id="busca-conversa"
          type="text"
          placeholder="Buscar conversa..."
          autocomplete="off"
        />
      </div>
    </div>

    <!-- Lista de Conversas -->
    <div class="conversas-scroll">
      <div class="conversas-section-title">Conversas</div>
      <div id="lista-conversas"></div>
    </div>

    <!-- Padrões -->
    <div class="sidebar-patterns">
      <div class="pattern-item">
        <div class="pattern-dot observer"></div>
        <span class="pattern-label">Padrão</span>
        <span class="pattern-name observer">Observer</span>
      </div>
      <div class="pattern-item">
        <div class="pattern-dot strategy"></div>
        <span class="pattern-label">Padrão</span>
        <span class="pattern-name strategy">Strategy</span>
      </div>
    </div>

  </aside>

  <!-- ─── CHAT AREA ─── -->
  <main class="chat-area">

    <!-- Header dinâmico -->
    <header class="chat-header" id="chat-header">
      <div class="chat-header-left">
        <div class="chat-channel-icon geral" id="header-icon">🌐</div>
        <div>
          <div class="chat-channel-name" id="header-nome">Canal Geral</div>
          <div class="chat-channel-sub" id="header-sub">ServidorCentral (Observer) — todos os usuários</div>
        </div>
      </div>
      <span id="badge-estrategia" class="badge-estrategia publico">PÚBLICO</span>
    </header>

    <!-- Mensagens -->
    <div id="messages-container" role="log" aria-live="polite" aria-label="Mensagens do chat"></div>

    <!-- Input -->
    <div id="input-area">
      <div class="input-row">
        <textarea
          id="msg-input"
          placeholder="Digite uma mensagem..."
          rows="1"
          aria-label="Campo de mensagem"
        ></textarea>
        <button id="btn-enviar" class="btn-enviar" title="Enviar mensagem" aria-label="Enviar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

  </main>
</div>

<!-- ════════════════════════════════════════════
     MODAL: CRIAR GRUPO
════════════════════════════════════════════ -->
<div id="modal-grupo" class="modal-overlay">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">

    <div class="modal-header">
      <div class="modal-header-icon">👥</div>
      <div>
        <div class="modal-titulo" id="modal-titulo">Criar Grupo</div>
        <div class="modal-subtitulo">Selecione os membros e dê um nome</div>
      </div>
      <button id="modal-fechar" class="modal-fechar" aria-label="Fechar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="modal-body">
      <label class="modal-label" for="modal-nome-grupo">Nome do grupo</label>
      <input
        id="modal-nome-grupo"
        type="text"
        class="modal-input"
        placeholder="Ex: Projeto Alpha, Amigos..."
        maxlength="40"
        autocomplete="off"
      />

      <div class="modal-label" style="margin-top: 20px;">Adicionar membros</div>
      <div id="modal-lista-membros" class="modal-lista-membros">
        <!-- Renderizado via JS -->
      </div>
    </div>

    <div class="modal-footer">
      <button class="modal-btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button id="modal-confirmar" class="modal-btn-criar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
        Criar Grupo
      </button>
    </div>

  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" role="alert" aria-live="assertive"></div>

<!-- ════════════════════════════════════════════
     SCRIPTS
════════════════════════════════════════════ -->
<script src="/socket.io/socket.io.js"></script>
<script src="js/interfaces/Observavel.js"></script>
<script src="js/interfaces/EstrategiaEnvio.js"></script>
<script src="js/models/Pacote.js"></script>
<script src="js/strategies/EnvioPublico.js"></script>
<script src="js/strategies/EnvioPrivado.js"></script>
<script src="js/core/CelularUsuario.js"></script>
<script src="js/app.js"></script>

</body>
</html>
